[workspace]
members = [
    "crates/flowdictate-asr",
    "crates/flowdictate-asr-ipc",
    "crates/flowdictate-nemotron-ipc",
    "crates/flowdictate-audio",
    "crates/flowdictate-pipeline",
    "crates/flowdictate-refine",
    "tools/flowdictate-asr-worker",
    "tools/flowdictate-capture-probe",
]
resolver = "2"

[workspace.package]
edition = "2021"
license = "MIT OR Apache-2.0"
rust-version = "1.88"

[workspace.lints.rust]
unsafe_code = "deny"
missing_docs = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
dbg_macro = "deny"
print_stdout = "deny"
print_stderr = "deny"
