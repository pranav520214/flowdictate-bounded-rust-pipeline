# FlowDictate dependency policy. Keep target scope explicit until other
# platforms have their own measured support and reviewed graphs.
[graph]
targets = [{ triple = "x86_64-pc-windows-msvc" }]
all-features = true

[advisories]
ignore = []

[licenses]
allow = [
    "0BSD",
    "Apache-2.0",
    "BSD-3-Clause",
    "ISC",
    "MIT",
    "Unlicense",
    "Unicode-3.0",
    "Zlib",
]
confidence-threshold = 0.93

[bans]
multiple-versions = "warn"
wildcards = "deny"
highlight = "all"
skip = [
    { crate = "shlex@1.3.0", reason = "bindgen 0.72.1 and cc 1.4.4 require incompatible build-only shlex major versions" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
